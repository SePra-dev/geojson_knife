[package]
name = "geojson_knife"
version = "0.1.0"
edition = "2021"
description = "GeoJSON Toolkit - a portable Swiss Army knife for GeoJSON files"
license = "MIT"
default-run = "geojson_knife"

[dependencies]
eframe = "0.27"
egui = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
rfd = "0.14"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 2
lto = true
strip = true
